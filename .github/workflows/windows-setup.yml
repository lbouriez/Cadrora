name: Windows installer checks

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-setup-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Require both PowerShell runtimes
        shell: pwsh
        run: |
          $legacy = Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'
          $modern = Join-Path $env:ProgramFiles 'PowerShell/7/pwsh.exe'
          if (-not (Test-Path -LiteralPath $legacy) -or -not (Test-Path -LiteralPath $modern)) {
            throw 'The installer checks require both Windows PowerShell 5.1 and PowerShell 7.'
          }
      - run: npm ci
      - run: npm run check
      # The test harness runs both shells; provider boundaries remain offline.
      # This job has no deployment environment or production secrets.
      - name: Check installer recovery, credentials and Windows permissions
        run: npm run test -- --maxWorkers=2
