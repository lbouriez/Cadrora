# Existing installation: retain its gate, environment, credentials and domain.
# All publication logic is shared with forks through publish-site.yml.
name: Atelier Giulia production
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    if: github.repository == 'lbouriez/Cadrora' && github.ref == 'refs/heads/main' && vars.ATELIER_GIULIA_DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/publish-site.yml
    with:
      environment: atelier-giulia-production
      legacy_profile: atelier-giulia
      legacy_instance: atelier-giulia
      legacy_hostname: ateliergiulia.com
      extended_smoke: true
      enforce_https_policy: true
    secrets: inherit
