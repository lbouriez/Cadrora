name: Publication du site

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      # Compatibility inputs for an existing maintained installation. New forks
      # use only environment variables and a checked-in deployment descriptor.
      legacy_profile:
        type: string
        default: ''
      legacy_instance:
        type: string
        default: ''
      legacy_hostname:
        type: string
        default: ''
      extended_smoke:
        type: boolean
        default: false
      enforce_https_policy:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: site-${{ github.repository }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publication / ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      CADRORA_SITE: ${{ inputs.legacy_profile || vars.CADRORA_SITE }}
      CADRORA_INSTANCE: ${{ inputs.legacy_instance || vars.CADRORA_INSTANCE }}
      CADRORA_HOSTNAME: ${{ inputs.legacy_hostname || vars.CADRORA_HOSTNAME }}
      CADRORA_ENVIRONMENT: ${{ inputs.environment }}
      CADRORA_LEGACY_TARGET: ${{ inputs.legacy_profile != '' }}
      CADRORA_SEED_DEMO: 'false'
      VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Verify the configured target
        run: node scripts/setup/deploymentConfig.mjs verify
      - run: npm ci
      - run: npm run check
      - run: npm run test -- --maxWorkers=2
      - name: Install browser for profile checks
        run: npx playwright install --with-deps chromium
      - name: Prepare the local test database
        run: npx wrangler d1 migrations apply cadrora --local
      - name: Build the shared showcase
        run: npm run build
        env:
          CADRORA_SITE: cadrora
          CADRORA_SEED_DEMO: 'true'
          VITE_APP_NAME: Cadrora
      - name: Check the shared first frame
        run: npx playwright test tests/e2e/startup-build.spec.ts --reporter=dot
        env:
          CADRORA_SITE: cadrora
          CADRORA_SEED_DEMO: 'true'
          CADRORA_E2E_BUILD: 'true'
          VITE_APP_NAME: Cadrora
      - name: Build the selected profile
        run: npm run build
      - name: Check the selected first frame
        run: npx playwright test tests/e2e/startup-build.spec.ts tests/e2e/selected-site-profile.spec.ts --reporter=dot
        env:
          CADRORA_E2E_BUILD: 'true'
      - name: Check the selected studio on desktop and phone
        if: inputs.extended_smoke
        run: npx playwright test tests/e2e/site-profile.spec.ts tests/e2e/service-photo-site-profile.spec.ts tests/e2e/sessions-visibility-site-profile.spec.ts tests/e2e/session-pricing-site-profile.spec.ts --reporter=dot
      - name: Refuse to deploy an outdated commit
        run: |
          latest="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)"
          test "$latest" = "$GITHUB_SHA"
      - name: Publish the selected site
        run: npm run deploy:instance -- --instance "$CADRORA_INSTANCE" --hostname "$CADRORA_HOSTNAME" --confirm
        env:
          FEATURE_PUBLIC_MEDIA_CACHE: ${{ vars.FEATURE_PUBLIC_MEDIA_CACHE || 'true' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ inputs.legacy_profile != '' && secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ADMIN_SECRET_HASH: ${{ secrets.ADMIN_SECRET_HASH }}
          AUTH_PEPPER: ${{ secrets.AUTH_PEPPER }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
      - name: Verify public HTTPS pages
        run: |
          for path in / /fr/contact/ /en/contact/ /admin/login /api/v1/galleries; do
            curl --fail --silent --show-error --retry 6 --retry-delay 10 "https://$CADRORA_HOSTNAME$path" -o /dev/null
          done
      - name: Verify domain HTTPS policy
        if: inputs.enforce_https_policy
        run: |
          https_headers="$(curl --fail --silent --show-error --head "https://$CADRORA_HOSTNAME/" | tr -d '\r')"
          printf '%s\n' "$https_headers" | grep -Eiq '^strict-transport-security:[[:space:]]*max-age=[1-9][0-9]*'
          ! printf '%s\n' "$https_headers" | grep -Eiq '^strict-transport-security:.*(includesubdomains|preload)'
          http_headers="$(curl --silent --show-error --head "http://$CADRORA_HOSTNAME/" | tr -d '\r')"
          printf '%s\n' "$http_headers" | grep -Fiq "location: https://$CADRORA_HOSTNAME/"
