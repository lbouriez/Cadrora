const homeA=()=>`<section class="immersive">${img('family',t.photoAlt)}<div class="hero-copy"><div class="eyebrow">${t.photography}</div><h1>${services[0].copy[lang].title}</h1><p>${t.familyShort}</p><div class="hero-actions"><button class="btn" data-details>${t.discover} <span>↗</span></button><a class="link" href="${url('contact')}">${t.write}</a></div></div><div class="slide-counter">01 / 05</div><nav class="session-selector" aria-label="${t.sessions}">${services.map((s,i)=>`<button data-slide="${i}" aria-pressed="${i===0}"><span class="num">0${i+1}</span>${t[key(s)]}</button>`).join('')}</nav><div class="slide-footer" hidden></div></section>`;

const dialog=document.querySelector('dialog');function openDialog(html){dialog.querySelector('.drawer-content').innerHTML=html;dialog.showModal();}function slide(i){active=i;const s=services[i], d=s.copy[lang], hero=document.querySelector('.immersive');hero.querySelector('.photo').src=`assets/photos/${key(s)}.webp`;hero.querySelector('.photo').alt=i===0?t.photoAlt:d.title;hero.querySelector('h1').textContent=d.title.replace('Portraits Photography','Portrait photography').replace('Couples Photography','Couples photography');hero.querySelector('.hero-copy p').textContent=i===0?t.familyShort:d.shortDescription;hero.querySelector('.slide-counter').textContent=`0${i+1} / 05`;hero.querySelectorAll('[data-slide]').forEach((b,n)=>b.setAttribute('aria-pressed',String(n===i)));const f=hero.querySelector('.slide-footer');f.hidden=i!==4;f.innerHTML=i===4?`<span>© Atelier Giulia · ${t.copyright}</span><a href="${url('privacy')}">${t.preferences}</a>`:'';}
document.addEventListener('click',e=>{const el=e.target.closest('button,a');if(!el)return;if(el.hasAttribute('data-slide'))slide(Number(el.dataset.slide));if(el.hasAttribute('data-details'))openDialog(session(key(services[active])));if(el.hasAttribute('data-close'))dialog.close();if(el.hasAttribute('data-menu')){const menu=document.querySelector('.mobile-menu');menu.hidden=!menu.hidden;el.setAttribute('aria-expanded',String(!menu.hidden));}if(el.hasAttribute('data-lang')){params.set('lang',lang==='fr'?'en':'fr');location.search=params.toString();}if(el.hasAttribute('data-consent')){el.closest('.privacy-bar').remove();sessionStorage.setItem('atelier-review-consent',el.dataset.consent);}if(el.hasAttribute('data-privacy')){e.preventDefault();openDialog(`<div class="page-wrap"><h2>${t.privacy}</h2><p style="margin-top:24px">${t.privacyDetails}</p></div>`);}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const menu=document.querySelector('.mobile-menu');menu.hidden=true;document.querySelector('[data-menu]').setAttribute('aria-expanded','false');}if((view==='home'||view==='privacy')&&direction==='a'&&!dialog.open&&!e.target.closest('a,button')){if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();slide((active+1)%5);}if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();slide((active+4)%5);}}});
